name: Build GameLauncher

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build with MSVC
        shell: cmd
        run: cl /nologo /W4 /O2 /Fe:GameLauncher.exe gamelauncher\main.c /link /SUBSYSTEM:CONSOLE comdlg32.lib user32.lib

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameLauncher-exe
          path: GameLauncher.exe
          if-no-files-found: error
